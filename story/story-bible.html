<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crimson X Story Bible</title>
<style>
:root{
  --bg:#0c0d0f; --panel:#15171b; --panel2:#1c1f24; --line:#2a2e35;
  --t1:#f1f2f4; --t2:#c3c7ce; --t3:#8d939c;
  --ac:#ff2d4a; --ac-soft:#ff6274;
  --hb:#ff2d4a; --corp:#6fb4ff; --ash:#e8a33a; --gone:#7d838c;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f3f1; --panel:#fff; --panel2:#f0eeeb; --line:#ddd9d3;
    --t1:#16171a; --t2:#3d4148; --t3:#6a6f77;
    --ac:#c4102a; --ac-soft:#b3192f; --hb:#c4102a; --corp:#1f6fc4; --ash:#a8650a;
  }
}
:root[data-theme="dark"]{ --bg:#0c0d0f; --panel:#15171b; --panel2:#1c1f24; --line:#2a2e35; --t1:#f1f2f4; --t2:#c3c7ce; --t3:#8d939c; --ac:#ff2d4a; --ac-soft:#ff6274; --hb:#ff2d4a; --corp:#6fb4ff; --ash:#e8a33a; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t2);font:15px/1.65 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px}
header{padding:48px 0 26px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kicker{color:var(--ac-soft);letter-spacing:.2em;font-size:12px;font-weight:700;text-transform:uppercase}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:var(--panel);color:var(--t2);border:0;padding:6px 14px;font:600 13px inherit;cursor:pointer}
.lang button.on{background:var(--t1);color:var(--bg)}
h1{color:var(--t1);font-size:clamp(32px,6vw,56px);line-height:1.06;margin:12px 0 12px}
h2{color:var(--t1);font-size:25px;margin:54px 0 6px}
h3{color:var(--t1);font-size:16.5px;margin:0 0 4px}
.lead{max-width:780px;font-size:17px}
.note{margin-top:16px;padding:12px 14px;border-left:3px solid var(--ac);background:var(--panel);font-size:13.5px;color:var(--t3);max-width:860px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:18px;overflow-x:auto;padding:10px 16px}
nav a{color:var(--t3);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
nav a:hover{color:var(--t1)}
.sub{color:var(--t3);max-width:800px;margin:0 0 18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card p{margin:0}
.fac{border-top:3px solid var(--c)} .fac .tag{color:var(--c);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.fac ul{margin:10px 0 0;padding-left:18px}
/* eras */
.eras{display:grid;gap:14px}
.era{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.era .eh{display:flex;gap:14px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.era .ey{color:var(--ac);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.era .et{color:var(--t1);font-weight:700;font-size:17px}
.era .es{color:var(--t3);font-size:13.5px;flex-basis:100%}
.era ul{list-style:none;margin:0;padding:6px 18px 12px}
.era li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.era li:last-child{border-bottom:0}
.era li b.y{color:var(--t1);font-variant-numeric:tabular-nums}
.era li .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c)}
.era li.key{background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:6px;padding-left:6px}
/* roster */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.filters button{background:var(--panel);color:var(--t2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:600 13px inherit;cursor:pointer}
.filters button.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.pc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pc.dead{opacity:.8}
.pc .hd{display:flex;gap:12px;align-items:center}
.pc img,.pc .ph{width:58px;height:58px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);flex:none}
.pc img{object-fit:cover;object-position:top}
.pc .ph{display:grid;place-items:center;color:var(--c);font-weight:800}
.pc .name{color:var(--t1);font-weight:700;line-height:1.2}
.pc .call{color:var(--c);font-size:12px;font-weight:700;letter-spacing:.05em}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--t2);border:1px solid var(--line)}
.chip.k{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.pc p{margin:0;font-size:13.5px}
.pc .hook{color:var(--t3);font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px}
.ages{display:grid;grid-template-columns:auto 1fr 1fr;font-size:12px;gap:2px 10px;color:var(--t3)}
.ages b{color:var(--t1);font-weight:600}
/* lifelines */
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:12px;overflow-x:auto}
.diagram svg{width:100%;min-width:720px;height:auto;display:block}
/* campaign */
.ms{display:grid;grid-template-columns:76px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.ms.fb{border-style:dashed;background:color-mix(in srgb,var(--panel) 85%,var(--ash) 4%)}
.ms .n{font-size:28px;font-weight:800;color:var(--ac);line-height:1}
.ms .yr{font-size:12px;color:var(--t3);margin-top:6px;font-variant-numeric:tabular-nums}
.ms .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--t3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
footer{margin-top:60px;color:var(--t3);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:560px){ .ms{grid-template-columns:1fr} .era li{grid-template-columns:52px 1fr} }
</style>
</head>
<body>
<header class="wrap">
  <div class="top"><div class="kicker" data-t="kicker"></div>
    <div class="lang" role="group" aria-label="Language"><button data-l="en">English</button><button data-l="zh">中文</button></div></div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="note" data-t="note"></div>
</header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap">
  <section id="rules"><h2 data-t="h.rules"></h2><p class="sub" data-t="s.rules"></p><div class="grid3" id="rulesGrid"></div></section>
  <section id="factions"><h2 data-t="h.fac"></h2><p class="sub" data-t="s.fac"></p><div class="grid3" id="facGrid"></div></section>
  <section id="eras"><h2 data-t="h.eras"></h2><p class="sub" data-t="s.eras"></p><div class="eras" id="eraList"></div></section>
  <section id="lives"><h2 data-t="h.lives"></h2><p class="sub" data-t="s.lives"></p><div class="diagram"><svg id="lifeSvg" viewBox="0 0 960 10"></svg></div>
    <div class="legend" id="legend"></div></section>
  <section id="roster"><h2 data-t="h.cast"></h2><p class="sub" data-t="s.cast"></p><div class="filters" id="filters"></div><div class="roster" id="grid"></div></section>
  <section id="campaign"><h2 data-t="h.camp"></h2><p class="sub" data-t="s.camp"></p><div id="missions"></div></section>
  <section id="open"><h2 data-t="h.open"></h2><div class="grid3" id="openGrid"></div></section>
  <footer data-t="foot"></footer>
</main>

          li:[['Wants: the plant safe and the city lit.','目标：保住电厂，让城市亮着灯。'],['Weakness: answers to the governments that sold the plant.','弱点：听命于出卖电厂的政府。']] },
  corp: { col:'var(--corp)', name:['Halcyne Power','哈尔辛电力'], sub:['The owner','电厂所有者'],

let lang = (()=>{ try { return localStorage.getItem('cx.storylang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'); } catch(e){ return 'en'; } })();
const L = p => Array.isArray(p) ? p[lang === 'zh' ? 1 : 0] : p;
const ageIn = (c, y) => y < c.born ? L(S.notborn) : (c.died && y > c.died) ? L(S.died) + ' ' + c.died : String(y - c.born);
let filter = 'all';

function render(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = L(S[e.dataset.t]); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.getElementById('nav').innerHTML = S.nav.map(n => `<a href="#${n[0]}">${lang === 'zh' ? n[2] : n[1]}</a>`).join('');
  document.getElementById('rulesGrid').innerHTML = RULES.map((r, i) => `<div class="card"><h3>${i + 1} · ${L(r[0])}</h3><p>${L(r[1])}</p></div>`).join('');
  document.getElementById('facGrid').innerHTML = Object.values(F).map(f => `<div class="card fac" style="--c:${f.col}"><div class="tag">${L(f.name)}</div><h3>${L(f.sub)}</h3><p>${L(f.body)}</p><ul>${f.li.map(x => `<li>${L(x)}</li>`).join('')}</ul></div>`).join('');
  document.getElementById('eraList').innerHTML = ERAS.map(e => `<div class="era"><div class="eh"><span class="ey">${e.y}</span><span class="et">${L(e.t)}</span><span class="es">${L(e.s)}</span></div>
    <ul>${e.ev.map(v => `<li class="${v[3] ? 'key' : ''}" style="--c:${F[v[1]].col}"><b class="y">${v[0]}</b><span><i class="dot"></i>${L(v[2])}</span></li>`).join('')}</ul></div>`).join('');
  drawLives();
  document.getElementById('legend').innerHTML = Object.values(F).map(f => `<span><i style="background:${f.col}"></i>${L(f.name)}</span>`).join('');
  const fl = [['all', S.all], ['hb', F.hb.name], ['corp', F.corp.name], ['ash', F.ash.name], ['playable', S.playable], ['boss', S.boss], ['npc', S.npc], ['legacy', S.legacy]];
  document.getElementById('filters').innerHTML = fl.map(x => `<button data-f="${x[0]}" class="${filter === x[0] ? 'on' : ''}">${L(x[1])}</button>`).join('');
  drawCast();
  document.getElementById('missions').innerHTML = MISSIONS.map((m, i) => `<div class="ms ${m.fb ? 'fb' : ''}"><div><div class="n">${String(i + 1).padStart(2, '0')}</div><div class="yr">${m.y}${m.fb ? ' · ' + L(S.flash) : ''}</div></div><div>
    <h3>${L(m.t)}</h3><p style="margin:2px 0 0">${L(m.d)}</p>
    <div class="row"><span class="chip k" style="--c:var(--ac)">${L(S.area)}: ${L(m.a)}</span><span class="chip">${L(S.talk)}: ${L(m.talk)}</span><span class="chip">${L(S.fight)}: ${L(m.fight)}</span></div></div></div>`).join('');
  document.getElementById('openGrid').innerHTML = OPEN.map(o => `<div class="card"><h3>${L(o[0])}</h3><p>${L(o[1])}</p></div>`).join('');
}
function drawCast(){
  const list = C.filter(c => filter === 'all' || c.f === filter || c.tags.includes(filter));
  document.getElementById('grid').innerHTML = list.map(c => {
    const pic = c.img ? `<img src="${IMG + c.img}" alt="" onerror="this.outerHTML='<div class=&quot;ph&quot;>${L(c.name)[0]}</div>'">` : `<div class="ph">${L(c.name)[0]}</div>`;
    return `<article class="pc ${c.died ? 'dead' : ''}" style="--c:${F[c.f].col}">
      <div class="hd">${pic}<div><div class="name">${L(c.name)}</div><div class="call">${L(c.call)}</div></div></div>
      <div class="ages"><span></span><b>1990</b><b>2026</b><span>${L(S.age)}</span><span>${ageIn(c, 1990)}</span><span>${ageIn(c, 2026)}</span></div>
      <div class="meta"><span class="chip k">${L(F[c.f].name)}</span><span class="chip">${c.born}${c.died ? '–' + c.died : ''}</span></div>
      <p>${L(c.bio)}</p><p class="hook">${L(c.hook)}</p></article>`; }).join('');
}
function drawLives(){
  const y0 = 1958, y1 = NOW, left = 170, W = 960, right = 20, row = 26, top = 30;
  const x = y => left + (W - left - right) * (y - y0) / (y1 - y0);
  const list = C.slice().sort((a, b) => a.born - b.born);
  const H = top + list.length * row + 30;
  let s = '';
  for (let y = 1960; y <= 2026; y += 10) s += `<line x1="${x(y)}" y1="${top - 10}" x2="${x(y)}" y2="${H - 24}" stroke="var(--line)"/><text x="${x(y)}" y="${top - 16}" text-anchor="middle" font-size="11" fill="var(--t3)">${y}</text>`;
  s += `<rect x="${x(1990)}" y="${top - 10}" width="${x(2026) - x(1990)}" height="${H - top - 14}" fill="var(--ac)" opacity=".05"/>`;
  for (const [yr, lab] of [[2004, lang === 'zh' ? '漫长黑夜' : 'Long Dark'], [2024, lang === 'zh' ? '停电之夜' : 'Blackout Night']])
    s += `<line x1="${x(yr)}" y1="${top - 10}" x2="${x(yr)}" y2="${H - 24}" stroke="var(--ac)" stroke-width="${yr === 2024 ? 2 : 1}" stroke-dasharray="${yr === 2024 ? '' : '4 4'}"/><text x="${x(yr)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ac-soft)">${lab} ${yr}</text>`;
  list.forEach((c, i) => {
    const y = top + i * row, end = c.died || NOW, col = F[c.f].col;
    s += `<text x="${left - 10}" y="${y + 13}" text-anchor="end" font-size="12.5" fill="var(--t2)">${L(c.name)}</text>`;
    s += `<rect x="${x(c.born)}" y="${y + 4}" width="${x(end) - x(c.born)}" height="12" rx="3" fill="${col}" opacity=".28"/>`;
    s += `<rect x="${x(c.at)}" y="${y + 4}" width="${Math.max(2, x(end) - x(c.at))}" height="12" rx="3" fill="${col}"/>`;
    if (c.died) s += `<text x="${x(end) + 5}" y="${y + 14}" font-size="12" fill="var(--t3)">✝</text>`;
  });
  const svg = document.getElementById('lifeSvg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif">${s}</g>`;
}
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.l; try { localStorage.setItem('cx.storylang', lang); } catch(err){} render(); });
document.getElementById('filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b)); drawCast(); });
render();
</script>
